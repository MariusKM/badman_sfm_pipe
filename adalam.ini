# hloc Pipeline Configuration — AdaLAM (GPU-accelerated matching)
# Use with --use_hloc or --use_hloc_matching flag
# Example: python run_glomap.py ... --use_hloc_matching --hloc_config adalam.ini

[LocalFeatures]
feature_type=sift
max_keypoints=32768
resize_max=3840
grayscale=true

[GlobalDescriptors]
network=netvlad
resize_max=1024

[PairGeneration]
num_matched=200
min_score=

[FeatureMatching]
# AdaLAM: GPU-accelerated matcher with spatial consistency filtering
# Works with SIFT descriptors and uses scales + orientations
matcher=adalam

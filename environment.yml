name: badman_sfm
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.11

  # Core scientific computing
  - numpy
  - scipy
  - pandas
  - h5py

  # Computer vision
  - opencv
  - scikit-image
  - pillow

  # Visualization
  - matplotlib
  - plotly
  - tqdm

  # Utilities
  - pyyaml
  - omegaconf
  - einops

  # Development
  - pip

  # Pip dependencies (PyTorch installed separately by setup script if needed)
  - pip:
    # COLMAP Python bindings
    - pycolmap>=3.13.0

    # Kornia (differentiable computer vision)
    - kornia>=0.6.11

    # Image downloading
    - gdown

    # LightGlue (feature matching)
    - lightglue @ git+https://github.com/cvg/LightGlue

    # Note: PyTorch and hloc are installed by setup script
    # PyTorch is only installed if not already available with CUDA support

# hloc Pipeline Configuration
# Separate configuration for hloc-based feature extraction, retrieval, and matching
# Use with --use_hloc flag in run_colmap.py, run_glomap.py, etc.

[LocalFeatures]
# Feature type for local feature extraction
# Options: sift, r2d2, superpoint, disk, aliked
# - sift: Dense, traditional features (best for Gaussian splatting)
# - r2d2: Dense, learned features (good alternative to SIFT)
# - superpoint: Sparse, learned features (fast but less dense)
# - disk: Dense, learned features
# - aliked: Lightweight learned features
feature_type=sift

# Maximum keypoints per image
# Higher values = denser point cloud (better for Gaussian splatting)
# Recommended: 8192 (default), 16384 (dense), 32768 (very dense)
max_keypoints=32768

# Maximum image dimension for feature extraction
# Larger = more features but slower
resize_max=3840

# Convert to grayscale before feature extraction (for SIFT)
grayscale=true

[GlobalDescriptors]
# Retrieval network for image pair generation
# Options: netvlad, openibl, dir, megaloc
# - netvlad: Classic, well-tested
# - openibl: Modern NetVLAD variant, recommended
# - dir: ResNet-101 based, potentially more accurate
# - megaloc: Latest model (2025)
network=netvlad

# Maximum image dimension for global descriptor extraction
resize_max=1024

[PairGeneration]
# Number of top-k similar images to match per query image
# Higher = more pairs = better coverage but slower matching
# Recommended: 50 (default), 100 (thorough), 20-30 (fast)
num_matched=200

# Minimum similarity score threshold (0.0-1.0)
# Leave empty to use all top-k matches
# Set to filter out low-confidence pairs (e.g., 0.5)
min_score=

[FeatureMatching]
# Matcher type for feature matching
# Options: NN-ratio, NN-mutual, adalam
# - NN-ratio: Standard nearest neighbor with Lowe's ratio test
# - NN-mutual: Mutual nearest neighbor matching
# - adalam: Adaptive LAtest Match (better but slower)
matcher=NN-ratio

# Ratio test threshold (for NN-ratio matcher)
# Lower = stricter matching = fewer but more reliable matches
# Recommended: 0.8 (default), 0.7 (strict), 0.9 (permissive)
ratio_threshold=0.8

# Enable cross-check for mutual matching
cross_check=true

# Maximum number of matches per image pair
# Set to 0 for unlimited
max_matches=0
